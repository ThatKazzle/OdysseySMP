name: SimpleS5
version: '${project.version}'
main: kazzleinc.simples5.SimpleS5
api-version: '1.21'
description:
  "Super baller plugin the best server ever, Odyssey SMP."

softdepend: [ ProtocolLib ]

commands:
  reloadconfig:
    description: "Reloads the plugin's config.yml (settings and power text). Player data is not affected."
    usage: "/reloadconfig"
    permission: simples5.admin
  odyssey:
    description: "All things Odyssey related."
    usage: "/odyssey <withdraw|description|powers>"
    aliases:
      - "od"
  power1:
    usage: "I don't think you gotta power lmao, this message shouldn't show"
  power2:
    usage: "I don't think you gotta power lmao, this message shouldn't show"
  resetcooldowns:
    usage: "/resetcooldowns"
    description: "resets the cooldowns of your enabled powers."
    aliases:
      - "rc"
  toggle-pvp:
    usage: "/toggle-pvp"
    description: "Opped players can enable or disable PvP."
  scatter:
    usage: "/scatter (radius)"
    description: "scatters players."
permissions:
  simples5.admin:
    description: "Use admin commands such as /reloadconfig."
    default: op
